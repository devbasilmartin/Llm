# Copied from skillbot (devbasilmartin/RuneScape, runelite/names.yaml): the in-game names
# behind each registry color. superbond2 uses it to say what a highlight could be. Keep the
# two files in step.
#
# In-game names for registry colors, used by `skillbot runelite-profile` to build the
# RuneLite `bot` profile (docs/runelite-profile.md). Names are exactly as the game shows
# them; add or fix any that don't match on your server.

# NPC Indicators: every name is highlighted; each NPC's color is set by its ids (looked up
# on the OSRS Wiki, or listed under npc_ids). The plugin's default color is `enemy`, so a
# name whose ids can't be found is left out (and reported) unless it's an enemy.
npcs:
  enemy: [Hill Giant, Moss giant, Sand Crab, Ammonite Crab, Chicken, Goblin, Dwarf, Minotaur,
          Lesser demon, Greater demon, Fire giant]
  cow: [Cow, Cow calf]
  fishing_spot: [Fishing spot, Rod Fishing spot]
  knight: [Knight of Ardougne]
  random_event: [Drunken Dwarf, Mysterious Old Man, Sergeant Damien, Evil Bob, Frog, Leo,
                 Rick Turpentine, Sandwich lady, Strange plant, Freaky Forester, Bee keeper,
                 Quiz Master, Pillory guard, Count Check, Dr Jekyll, Flippa, Niles, Miles,
                 Giles, Postie Pete]
  genie: [Genie]
  grave: [Grave]
  slayer_master: [Turael, Vannaka, Chaeldar, Nieve, Duradel]
  phials: [Phials]

# Fishing spots share one name, so their colors come from ids: RuneLite's FishingSpot list
# (net/bait + lure/bait → fishing_spot, cage/harpoon → lobster_spot, net/harpoon →
# harpoon_spot). Swordfish and tuna are caught at cage/harpoon spots, which are lobster_spot.
npc_ids:
  fishing_spot: [1514, 1517, 1518, 1521, 1523, 1524, 1525, 1528, 1530, 1544, 3913, 7155, 7459,
                 7462, 7467, 7469, 7947, 10513, 12778, 14038, 14040, 14041, 14524, 15066, 16338,
                 394, 1506, 1507, 1508, 1509, 1512, 1513, 1515, 1516, 1526, 1527, 1529, 3417,
                 3418, 7463, 7464, 7468, 8524, 12774, 14036, 14521, 14522, 14525, 14526, 14527,
                 14528, 15072, 15073]
  lobster_spot: [1510, 1519, 1522, 2146, 3914, 5820, 7199, 7460, 7465, 7470, 7946, 9173, 9174,
                 10515, 10635, 12777, 14039, 15070, 15071, 15075, 15076, 15079, 15084, 15086,
                 16340]
  harpoon_spot: [1511, 1520, 3419, 3915, 4476, 4477, 5233, 5234, 5821, 7200, 7461, 7466, 8525,
                 8526, 8527, 9171, 9172, 10514, 12775, 12776, 14037, 14523, 15067, 15068, 15069,
