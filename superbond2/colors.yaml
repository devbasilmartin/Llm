# Copied from skillbot (devbasilmartin/RuneScape, colors.yaml) so both bots read the same
# RuneLite "bot" profile: keep the two files in step when colors change.
#
# The color registry: one name, one color, one meaning. Shared by all accounts (they
# share RuneLite's `bot` profile). Use these names in config.yaml instead of [r, g, b].
# Set each plugin's color to exactly these values, fully opaque.
#
# Rules (checked automatically):
# - item colors (Inventory Tags) must all differ from each other
# - world highlights must differ when they can be on screen together: same `area`
#   (default if not given), or either one is `area: everywhere`. Minigames get their own area.
# `python -m skillbot colors` lists the registry and free colors you can add.

# --- banks and stations (Object Markers) ---
bank:            {rgb: [255, 0, 255],   category: bank, area: everywhere}
altar:           {rgb: [0, 192, 128],   category: station}
range:           {rgb: [255, 64, 128],  category: station}
furnace:         {rgb: [192, 255, 64],  category: station}
anvil:           {rgb: [64, 0, 255],    category: station}

# --- resources (Object Markers / NPC Indicators) ---
tree:            {rgb: [64, 192, 255],   category: resource}
oak_tree:        {rgb: [0, 192, 192],   category: resource}
willow_tree:     {rgb: [0, 128, 192],   category: resource}
fishing_spot:    {rgb: [0, 255, 128],   category: resource}
rock:            {rgb: [255, 64, 0],    category: resource}

# --- construction (Object Markers in your house) ---
build_spot:      {rgb: [0, 192, 255],   category: station}  # the hotspot you build on

# --- combat (NPC Indicators, Ground Items) ---
cow:             {rgb: [255, 128, 255], category: enemy}
enemy:           {rgb: [192, 64, 255],  category: enemy}
loot:            {rgb: [255, 192, 0],   category: loot, area: everywhere}
random_event:    {rgb: [128, 0, 0],     category: danger, area: everywhere}

genie:           {rgb: [64, 255, 255],  category: other, area: everywhere}    # NPC Indicators: Genie (lamp)
grave:           {rgb: [192, 0, 64],    category: other, area: everywhere}    # NPC Indicators: Grave
respawn:         {rgb: [255, 64, 192],  category: other, area: everywhere}    # Ground Marker: your respawn tile
other_player:    {rgb: [64, 192, 64],   category: other, area: everywhere}    # Player Indicators: others

# --- runecrafting (Object Markers) ---
ruins:           {rgb: [64, 255, 0],   category: portal}
altar_portal:    {rgb: [128, 0, 192],   category: portal}

# --- agility (Object Markers on each obstacle, in course order; long courses reuse them) ---
obstacle_1:      {rgb: [0, 0, 255],     category: resource}
obstacle_2:      {rgb: [0, 255, 64],    category: resource}
obstacle_3:      {rgb: [192, 0, 255],   category: resource}
obstacle_4:      {rgb: [255, 64, 64],   category: resource}
obstacle_5:      {rgb: [192, 192, 64],  category: resource}
obstacle_6:      {rgb: [64, 128, 255],  category: resource}
obstacle_7:      {rgb: [128, 255, 64],  category: resource}
mark_of_grace:   {rgb: [255, 192, 64],  category: loot}     # Ground Items / Agility plugin

# --- route tiles (Ground Markers); a route uses each color at most once ---
afk_spot:        {rgb: [0, 192, 64],    category: route}    # where to stand at crabs
reset_spot:      {rgb: [64, 0, 192],    category: route}    # where to walk to reset aggression
tile_plum:       {rgb: [128, 64, 192],  category: route}   # not white: that is the game's text color
tile_lilac:      {rgb: [128, 128, 255], category: route}
tile_blue:       {rgb: [0, 64, 255],    category: route}
tile_lime:       {rgb: [128, 255, 0],   category: route}
tile_lemon:      {rgb: [255, 255, 128], category: route}
tile_mint:       {rgb: [64, 255, 64], category: route}
tile_teal:       {rgb: [64, 255, 192],  category: route}
fm_start:        {rgb: [128, 192, 0],   category: route}   # not yellow: overhead chat

# --- navigation ---
path:            {rgb: [255, 0, 128],   category: route, area: everywhere}   # Shortest Path: path color (scene + minimap)
stairs:          {rgb: [192, 0, 192],   category: portal, area: everywhere}   # Object Markers: stairs on travel routes (Lumbridge castle)
hub_marker:      {rgb: [192, 192, 0],   category: route, area: everywhere}   # Ground Marker on each hub's arrival tile

